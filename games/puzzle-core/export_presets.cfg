html/custom_html_shell=""
html/head_include="<!--\n  head_include.html — 注入到 Godot 导出的 index.html <head> 里的一段 CSS + JS。\n  由 workflow/scripts/gf-web-inject.sh 写进 export_presets.cfg 的 html/head_include，\n  这样这段代码是**可读、可 diff、可维护**的源文件，而不是塞在一行里的转义字符串。\n\n  它解决三件事：\n    1) 画布贴合“可见视口” + 尊重安全区域（刘海 / 灵动岛 / 底部手势条）\n    2) 渲染分辨率按设备分级给预算 —— 既要高清，又不能把 GPU 撑死\n    3) 移动端原生手势（滚动/缩放/长按菜单）不要和游戏的滑动操作打架\n-->\n<style>\n  /* 画布高度用 100dvh（动态视口高度）而不是 100vh：\n     iOS Safari 的 100vh 会把底部工具栏算进去，导致底部按钮被工具栏压住、\n     玩家“界面显示不全”。dvh 不支持时这条规则会被忽略，退回模板的 100%（优雅降级）。 */\n  html, body {\n    height: 100dvh !important;\n    margin: 0;\n    overflow: hidden;\n    overscroll-behavior: none;\n    background: #0b0f18 !important;\n  }\n  body {\n    /* 触摸设备上禁掉浏览器自带手势，滑动只交给游戏 */\n    -webkit-user-select: none;\n    user-select: none;\n    -webkit-touch-callout: none;\n    -webkit-tap-highlight-color: transparent;\n  }\n  #canvas {\n    touch-action: none;\n    display: block;\n  }\n  .gf-noscroll { position: fixed; inset: 0; }\n</style>\n<script>\n(function () {\n  \"use strict\";\n  var q = window.location.search || \"\";\n  function flag(name) { return q.indexOf(name + \"=1\") >= 0; }\n  function num(name) {\n    var m = q.match(new RegExp(\"[?&]\" + name + \"=([0-9.]+)\"));\n    return m ? parseFloat(m[1]) : null;\n  }\n\n  /* ── 1) 安全区域 ───────────────────────────────────────────────────────\n     viewport-fit=cover 之后 env(safe-area-inset-*) 才有意义。\n     加了 cover，页面会铺到刘海下面，所以**必须**把 inset 交给 UI 去避让；\n     这里把 inset 读出来给 Godot（main.gd 每帧只读一次，变化时才更新）。 */\n  function patchViewport() {\n    try {\n      var mv = document.querySelector('meta[name=\"viewport\"]');\n      if (mv && mv.getAttribute(\"content\").indexOf(\"viewport-fit\") < 0) {\n        mv.setAttribute(\"content\", mv.getAttribute(\"content\") + \", viewport-fit=cover\");\n      }\n    } catch (e) {}\n  }\n  patchViewport();   // head_include 注在 Godot 的 viewport meta 之后，这里能立刻生效\n  document.addEventListener(\"DOMContentLoaded\", patchViewport);   // 兜底\n\n  window.gfSafeInsets = function () {\n    try {\n      var d = document.createElement(\"div\");\n      d.style.cssText = \"position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;\" +\n        \"padding:env(safe-area-inset-top) env(safe-area-inset-right) \" +\n        \"env(safe-area-inset-bottom) env(safe-area-inset-left);\";\n      document.body.appendChild(d);\n      var cs = getComputedStyle(d);\n      var r = {\n        top: parseFloat(cs.paddingTop) || 0,\n        right: parseFloat(cs.paddingRight) || 0,\n        bottom: parseFloat(cs.paddingBottom) || 0,\n        left: parseFloat(cs.paddingLeft) || 0\n      };\n      d.remove();\n      return JSON.stringify(r);\n    } catch (e) {\n      return '{\"top\":0,\"right\":0,\"bottom\":0,\"left\":0}';\n    }\n  };\n\n  /* ── 2) 渲染分辨率：高清 vs “别把 GPU 撑死” ───────────────────────────\n     早期版本无条件把总像素钳到 1.6M —— 在 Retina 屏上等于「先渲染小图再放大」，\n     所以画面发虚（当时是为了绕开 Safari 丢上下文，而真正的元凶其实是默认\n     4096×4096 的方向光阴影贴图，已修）。\n     现在按设备分级给像素预算，并且底线是 1.0：**任何设备都不会比 CSS 分辨率更模糊**。\n     小窗口反而会超采样（ratio 可达 2.0），于是“不同屏幕尺寸都能保持清晰”。\n\n     URL 开关（排障用）：\n       ?px=2.5   总像素预算（百万像素）\n       ?dpr=1.5  devicePixelRatio 上限\n       ?lite=1   低端 GPU 档（同时会关阴影/渐变幕布，见 main.gd） */\n  var touch = (\"ontouchstart\" in window) || (navigator.maxTouchPoints > 0);\n  var budget = touch ? 3.0e6 : 4.2e6;\n  if (flag(\"lite\")) budget = 1.4e6;\n  var pxOverride = num(\"px\");\n  if (pxOverride) budget = pxOverride * 1e6;\n  var maxRatio = num(\"dpr\") || 2.0;\n  var HARD_MAX = 6.0e6;   // 极端大窗口下的硬上限，避免帧缓冲大到 GPU 取不回上下文\n  var rawDPR = window.devicePixelRatio || 1;\n\n  function ratio() {\n    var a = Math.max(window.innerWidth * window.innerHeight, 1);\n    var r = Math.min(rawDPR, maxRatio, Math.sqrt(budget / a));\n    if (r < 1.0) {\n      // 只有窗口大到超过 HARD_MAX 时才允许低于 1.0\n      r = Math.max(r, Math.min(1.0, Math.sqrt(HARD_MAX / a)));\n    }\n    return r;\n  }\n\n  try {\n    Object.defineProperty(window, \"devicePixelRatio\", { configurable: true, get: ratio });\n  } catch (e) {}\n\n  function patchGD() {\n    var g = window.GodotDisplayScreen;\n    if (g && !g.__gfClamped) {\n      g.__gfClamped = true;\n      g.getPixelRatio = ratio;   // 双保险：Godot 直接问它要像素比\n      try { window.dispatchEvent(new Event(\"resize\")); } catch (e) {}\n    }\n  }\n  document.addEventListener(\"DOMContentLoaded\", patchGD);\n  window.addEventListener(\"load\", patchGD);\n  for (var i = 0; i < 8; i++) { setTimeout(patchGD, i * 200); }\n  window.addEventListener(\"resize\", patchGD);\n\n  /* ── 3) 诊断面板（供 WebGL 排障，仅在对局失败时显示）───────────────── */\n  function diag() {\n    var c = document.getElementById(\"canvas\") || {};\n    var px = ((c.width || 0) * (c.height || 0)) / 1e6;\n    var d = [\n      \"canvas 绘图缓冲 : \" + (c.width || \"?\") + \" x \" + (c.height || \"?\") + \"  (\" + px.toFixed(2) + \"M px)\",\n      \"devicePixelRatio: \" + rawDPR + \"  -> 实际 \" + ratio().toFixed(2),\n      \"窗口(CSS)      : \" + window.innerWidth + \" x \" + window.innerHeight,\n      \"屏幕           : \" + screen.width + \" x \" + screen.height,\n      \"安全区域(px)   : \" + window.gfSafeInsets(),\n      \"存活时长       : \" + (performance.now() / 1000).toFixed(1) + \" s\",\n    ];\n    try {\n      var t = document.createElement(\"canvas\").getContext(\"webgl2\");\n      if (t) {\n        var dbg = t.getExtension(\"WEBGL_debug_renderer_info\");\n        d.push(\"新开 WebGL2    : \" + (t.isContextLost() ? \"已丢失（GPU 进程整体异常）\" : \"可用\"));\n        d.push(\"renderer       : \" + (dbg ? t.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : t.getParameter(t.RENDERER)));\n        d.push(\"MAX_RENDERBUFFER_SIZE: \" + t.getParameter(t.MAX_RENDERBUFFER_SIZE));\n      } else {\n        d.push(\"新开 WebGL2    : 拿不到上下文（已达上限或是能力问题）\");\n      }\n    } catch (e) { d.push(\"WebGL2 探测异常: \" + e); }\n    return d.join(\"\\n\");\n  }\n\n  function showDiag() {\n    var el = document.getElementById(\"status-notice\");\n    if (!el) { return; }\n    if (!document.getElementById(\"gf-diag\")) {\n      var pre = document.createElement(\"pre\");\n      pre.id = \"gf-diag\";\n      pre.style.cssText = \"user-select:all;-webkit-user-select:all;background:#131a28;\" +\n        \"border:1px solid #263149;border-radius:8px;padding:10px 12px;margin:10px 0;\" +\n        \"text-align:left;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\" +\n        \"color:#aab6d0;white-space:pre-wrap;word-break:break-word\";\n      el.parentNode.insertBefore(pre, el.nextSibling);\n    }\n    var box = document.getElementById(\"gf-diag\");\n    box.textContent = diag() + \"\\n\\n若画面异常，可在网址后加 ?lite=1 关闭阴影与特效再试。\";\n  }\n  window.addEventListener(\"error\", function (ev) {\n    var m = String((ev && ev.message) || \"\");\n    if (m.indexOf(\"WebGL\") >= 0 || m.indexOf(\"context\") >= 0) { setTimeout(showDiag, 300); }\n  });\n  if (window.Godot && window.Godot.runtime) { /* 无操作：仅保持时序明确 */ }\n})();\n</script>\n"
