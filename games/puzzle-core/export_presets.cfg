html/head_include="<style>#canvas{position:absolute;inset:0;margin:auto;\n  width:min(100vw,calc(100vh*16/9))!important;height:auto!important;aspect-ratio:16/9}\nbody{background:#0b0f18!important}</style><script>(function(){\n  var show=function(html){\n    var s=document.getElementById('status'),n=document.getElementById('status-notice'),\n        p=document.getElementById('status-progress'),i=document.getElementById('status-splash');\n    if(!s||!n){document.body.insertAdjacentHTML('beforeend',\n      '<div style=\"position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'\n      +'background:#0b0f18;color:#e8eefc;font:15px/1.7 system-ui,-apple-system,sans-serif;'\n      +'padding:24px;text-align:center\"><div>'+html+'</div></div>');return}\n    if(i)i.style.display='none';\n    if(p)p.style.display='none';\n    s.style.visibility='visible';\n    n.style.display='block';\n    n.innerHTML=html;\n  };\n  var orig=window.alert;\n  window.alert=function(m){\n    m=String(m);\n    if(!/context lost/i.test(m)){return orig.call(window,m)}\n    show('<b style=\"font-size:18px\">显卡上下文丢失</b>'\n      +'<p style=\"margin:.7rem 0 .3rem\">浏览器回收了 WebGL 上下文。'\n      +'Safari 的 WebGL 内存上限较紧，关闭其他标签页后刷新通常即可恢复。</p>'\n      +'<p style=\"color:#8b97b0;font-size:13px\">若反复出现，建议改用 Chrome / Edge / Firefox。</p>'\n      +'<p style=\"margin-top:1.1rem\">'\n      +'<button onclick=\"location.reload()\" style=\"padding:.55rem 1.4rem;border:0;border-radius:999px;'\n      +'background:#2f6fd0;color:#fff;font-size:14px;cursor:pointer\">重新加载</button></p>');\n  };\n})();</script>"
