html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>body{background:#0b0f18!important}\n#gf-diag{user-select:all;-webkit-user-select:all;background:#131a28;border:1px solid #263149;\n  border-radius:8px;padding:10px 12px;margin:10px 0;text-align:left;font:12px/1.6 ui-monospace,\n  SFMono-Regular,Menlo,Consolas,monospace;color:#aab6d0;white-space:pre-wrap;word-break:break-word}</style><script>(function(){\n  // ── 1) 帧缓冲确定性上限：钳制 devicePixelRatio，使总像素 <= MAXPX ──────────\n  // 不依赖 Godot 的 canvas_resize_policy 语义（策略 1 取项目尺寸还是窗口尺寸\n  // 在不同版本/平台上不一致），直接从像素比入手封顶。\n  var MAXPX = 1.6e6, MAXR = 2.0, MINR = 0.5;\n  var rawDPR = window.devicePixelRatio || 1;\n  function ratio(){\n    var a = Math.max(window.innerWidth * window.innerHeight, 1);\n    return Math.max(MINR, Math.min(rawDPR, MAXR, Math.sqrt(MAXPX / a)));\n  }\n  try { Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: ratio }); } catch (e) {}\n  function patchGD(){\n    var g = window.GodotDisplayScreen;\n    if (g && !g.__gfClamped) {\n      g.__gfClamped = true;\n      g.getPixelRatio = ratio;\n      try { window.dispatchEvent(new Event('resize')); } catch (e) {}\n    }\n  }\n  document.addEventListener('DOMContentLoaded', patchGD);\n  window.addEventListener('load', patchGD);\n  for (var i = 0; i < 8; i++) { setTimeout(patchGD, i * 200); }\n  window.addEventListener('resize', patchGD);\n\n  // ── 2) 诊断信息（供排查 WebGL context lost）────────────────────────────\n  function diag(){\n    var c = document.getElementById('canvas') || {};\n    var px = ((c.width || 0) * (c.height || 0)) / 1e6;\n    var d = [\n      'canvas 绘图缓冲 : ' + (c.width || '?') + ' x ' + (c.height || '?') + '  (' + px.toFixed(2) + 'M px)',\n      'CSS 显示尺寸   : ' + (c.style ? c.style.width + ' x ' + c.style.height : '?'),\n      'devicePixelRatio: ' + rawDPR + '  -> 钳制后 ' + ratio().toFixed(2),\n      '窗口(CSS)      : ' + window.innerWidth + ' x ' + window.innerHeight,\n      '屏幕           : ' + screen.width + ' x ' + screen.height,\n      '存活时长       : ' + (performance.now() / 1000).toFixed(1) + ' s',\n    ];\n    try {\n      var t = document.createElement('canvas').getContext('webgl2');\n      if (t) {\n        var dbg = t.getExtension('WEBGL_debug_renderer_info');\n        var lost = t.isContextLost();\n        d.push('新开 WebGL2    : ' + (lost ? '已丢失（GPU 进程整体异常）' : '可用'));\n        d.push('renderer       : ' + (dbg ? t.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : t.getParameter(t.RENDERER)));\n        d.push('vendor         : ' + (dbg ? t.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : t.getParameter(t.VENDOR)));\n        d.push('MAX_RENDERBUFFER_SIZE: ' + t.getParameter(t.MAX_RENDERBUFFER_SIZE));\n      } else {\n        d.push('新开 WebGL2    : 拿不到上下文（已达上限或是能力问题）');\n      }\n    } catch (e) { d.push('WebGL2 探测异常: ' + e); }\n    return d.join('\\n');\n  }\n\n  function show(html){\n    var s = document.getElementById('status'), n = document.getElementById('status-notice'),\n        p = document.getElementById('status-progress'), im = document.getElementById('status-splash');\n    if (!s || !n) {\n      document.body.insertAdjacentHTML('beforeend',\n        '<div style=\"position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'\n        + 'background:#0b0f18;color:#e8eefc;font:14px/1.7 system-ui,-apple-system,sans-serif;'\n        + 'padding:20px;text-align:center;overflow:auto\"><div style=\"max-width:36rem\">' + html + '</div></div>');\n      return;\n    }\n    if (im) { im.style.display = 'none'; }\n    if (p) { p.style.display = 'none'; }\n    s.style.visibility = 'visible';\n    n.style.display = 'block';\n    n.style.margin = '0 1rem';\n    n.innerHTML = html;\n  }\n\n  var orig = window.alert;\n  window.alert = function(m){\n    m = String(m);\n    if (!/context lost/i.test(m)) { return orig.call(window, m); }\n    show('<b style=\"font-size:17px\">显卡上下文丢失</b>'\n      + '<p style=\"margin:.6rem 0 0;font-size:13px\">浏览器回收了 WebGL 上下文。'\n      + '下面的信息请截图反馈，用于定位原因。</p>'\n      + '<div id=\"gf-diag\">' + diag() + '</div>'\n      + '<p style=\"color:#8b97b0;font-size:12px;margin:.2rem 0 .9rem\">'\n      + '可先试：在网址末尾加上 <b>?lite=1</b> 回车（关闭阴影与幕布，大幅降低 GPU 负载）。</p>'\n      + '<button onclick=\"location.reload()\" style=\"padding:.5rem 1.3rem;border:0;border-radius:999px;'\n      + 'background:#2f6fd0;color:#fff;font-size:14px;cursor:pointer\">重新加载</button>');\n  };\n})();</script>"
